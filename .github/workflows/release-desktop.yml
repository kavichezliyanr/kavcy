name: Auto SemVer Tag & Release Executables (macOS & Windows)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  semver-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Checkout full git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next semantic version & push tag
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          LAST_TAG=$(git tag --list "v*.*.*" --sort=-v:refname | head -n 1)
          COMMIT_MSG=$(git log -1 --pretty=%B)

          if [ -z "$LAST_TAG" ]; then
            NEXT_VERSION="1.0.0"
          else
            CLEAN="${LAST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN"
            if echo "$COMMIT_MSG" | grep -qE "BREAKING CHANGE|^[a-z]+(\(.+\))?!:"; then
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
            elif echo "$COMMIT_MSG" | grep -qE "^feat(\(.+\))?:"; then
              MINOR=$((MINOR + 1))
              PATCH=0
            else
              PATCH=$((PATCH + 1))
            fi
            NEXT_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi

          NEXT_TAG="v${NEXT_VERSION}"
          echo "Next semantic version: ${NEXT_TAG}"
          git tag -a "$NEXT_TAG" -m "Release ${NEXT_TAG}"
          git push origin "$NEXT_TAG"

          echo "tag=${NEXT_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${NEXT_VERSION}" >> "$GITHUB_OUTPUT"

  build-executables:
    needs: semver-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            artifact: release/*.dmg
          - os: windows-latest
            platform: win
            artifact: release/*.exe

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Post-Quantum Crypto Tests
        run: npm run test:crypto

      - name: Stamp Semantic Version
        run: npm version "${{ needs.semver-tag.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Build Web Assets
        run: npm run build

      - name: Install Electron & Electron Builder
        run: npm install --no-save electron electron-builder

      - name: Package ${{ matrix.platform }} Executable
        run: npx electron-builder --${{ matrix.platform }} --publish never

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kavcy-${{ matrix.platform }}
          path: ${{ matrix.artifact }}

  publish-release:
    needs: [semver-tag, build-executables]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release ${{ needs.semver-tag.outputs.tag }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.semver-tag.outputs.tag }}
          name: Kavcy ${{ needs.semver-tag.outputs.tag }}
          generate_release_notes: true
          files: |
            artifacts/kavcy-mac/*.dmg
            artifacts/kavcy-win/*.exe
